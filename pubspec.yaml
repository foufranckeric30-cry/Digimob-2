name: digicable_mobile
description: Application mobile DigiCâble pour les clients de Côte d'Ivoire Câbles.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.7.0
  flutter_riverpod: ^2.6.1
  flutter_secure_storage: ^9.2.2
  go_router: ^14.8.1
  json_annotation: ^4.9.0
  firebase_core: ^5.1.0
  cloud_firestore: ^7.1.0
  firebase_auth: ^7.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.13
  json_serializable: ^6.9.0
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
